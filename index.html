<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cerlesse</title>
    <meta name="description" content="基于 SearXNG 实时检索与 AgentTeam 多智能体协同的智搜引擎，支持根据搜索结果自定义生成独有卡片组件、多Agent并发搜索、小组件并行构建与拓扑自适应排版。" />
    <meta property="og:title" content="Cerlesse" />
    <meta property="og:description" content="基于 SearXNG 实时检索与 AgentTeam 多智能体协同的智搜引擎，支持根据搜索结果自定义生成独有卡片组件、多Agent并发搜索、小组件并行构建与拓扑自适应排版。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>

  </body>
