    <meta property="og:description" content="基于 SearXNG 实时检索与 Agent 智能体驱动的智搜引擎，支持全网深度搜索、小组件交互与拓扑自适应排版。" />

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <script>
      (function() {
        // 捕获并静默容器/iFrame 预览环境下 Vite HMR WebSocket 的安全拦截异常
        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            (event.reason.message === 'WebSocket closed without opened.' ||
             String(event.reason).includes('WebSocket closed without opened') ||
             String(event.reason).includes('[vite] failed to connect to websocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (
            event.message &&
            (event.message.includes('WebSocket closed without opened') ||
             event.message.includes('[vite] failed to connect to websocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
